<circle class="pipe-node" cx="122" cy="128" r="6" stroke-width="0.5"/>
<circle class="pipe-node" cx="148" cy="105" r="6" stroke-width="0.5"/>
<rect class="gate" x="-13" y="-13" width="26" height="26" rx="3" transform="translate(78,80) rotate(45)" stroke-width="2"/>
<rect class="gate" x="-13" y="-13" width="26" height="26" rx="3" transform="translate(158,140) rotate(45)" stroke-width="2"/>
<text class="title" x="240" y="118">openspec</text>
