schema: spec-driven

# Project context (optional)
# This is shown to AI when creating artifacts.
# Add your tech stack, conventions, style guides, domain knowledge, etc.
# Example:
#   context: |
#     Tech stack: TypeScript, React, Node.js
#     We use conventional commits
#     Domain: e-commerce platform

# Per-artifact rules (optional)
# Add custom rules for specific artifacts.
# Example:
#   rules:
#     proposal:
#       - Keep proposals under 500 words
#       - Always include a "Non-goals" section
#     tasks:
#       - Break tasks into chunks of max 2 hours

# Per-operation guidance (optional)
# Add advisory guidance for how apply and archive work should be conducted.
# This is separate from artifact rules above.
# Example:
#   operations:
#     apply:
#       guidance:
#         - Keep test summaries concise
#     archive:
#       guidance:
#         - Summarize the archive outcome before finishing

# Autonomous orchestration (optional, read by scripts/run-change in the
# openspec-global-store engine — see AUTONOMOUS-ORCHESTRATION.md there).
# Single rule: this block lives ONLY in a store's openspec/config.yaml.
# Target projects must not contain an openspec/ folder at all — run-change
# refuses any project that does.
# Example:
#   orchestration:
#     concurrency: 2
#     gate_quick: "npm run lint && npm run typecheck"
#     gate_full: "npm test"
# This store gates its own engine scripts with tests/run.sh.
orchestration:
  concurrency: 1
  gate_quick: "bash -n scripts/run-change && bash -n scripts/lib.sh"
  gate_full: "./tests/run.sh"
