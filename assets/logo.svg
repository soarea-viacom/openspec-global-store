<svg width="680" height="240" viewBox="0 0 680 240" xmlns="http://www.w3.org/2000/svg" role="img">
<title>openspec-orchestrator</title>
<desc>A rounded square badge containing a brain outline. Inside, three connected dots represent the autonomous Propose-Apply-Verify pipeline. Two diamond markers on the brain's edge represent the two human checkpoints. Next to the badge is the wordmark "openspec" with subtitle "orchestrator".</desc>
<style>
  .badge { fill: #EEEDFE; stroke: #534AB7; }
  .brain { fill: none; stroke: #534AB7; }
  .pipe-line { stroke: #0F6E56; }
  .pipe-node { fill: #5DCAA5; stroke: #0F6E56; }
  .gate { fill: #FAECE7; stroke: #D85A30; }
  .title { fill: #1a1a1a; font-family: -apple-system, "Segoe UI", sans-serif; font-size: 28px; font-weight: 500; }
  .subtitle { fill: #5F5E5A; font-family: -apple-system, "Segoe UI", sans-serif; font-size: 16px; font-weight: 400; }
</style>
